<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="./assets/svg/fotogram_logo.svg">
    <title>Fotogram</title>

    <script src="./js script/photo.js"></script>

    <link rel="stylesheet" href="./css/fonts.css">
    <link rel="stylesheet" href="./css/style.css">

</head>

<body onload="render()">
    <header>
        <div>
            <img src="./assets/svg/fotogram_name_logo.svg" alt="Fotogram logo with lettering">
        </div>
    </header>
    <main>
        <section>
            <h1>Your personal photo album</h1>
            <div id="photos"></div>
            <dialog id="photoDialog">
                <header>
                    <h2>
                        Mein Dialog
                    </h2>
                </header>

                <section>
                    <p>Hier siehst du die Information die ich dir Banane...</p>
                </section>

                <footer>
                    <button onclick="closeDialog()">Schließen</button>
                </footer>
            </dialog>
        </section>
    </main>
    <footer>
        <img class="footer_wave" src="./assets/svg/footer_curved.svg" alt="Curved footer">
        <div class="footer_content">
            <img src="./assets/svg/da_logo.svg" alt="Developer Akademie logo with lettering">
        </div>
    </footer>

    <script src="./js script/dialog.js"></script>

</body>

</html>
