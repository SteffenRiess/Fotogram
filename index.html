<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="./assets/svg/fotogram_logo.svg">
    <title>Fotogram</title>

    <script src="./script.js" defer></script>
    <!-- <script src="./js script/dialog.js" defer></script> -->

    <link rel="stylesheet" href="./css/fonts.css">
    <link rel="stylesheet" href="./css/style.css">

</head>

<body onload="render()">
    <header class="bodyHeader">
        <div class="headerLogo">
            <img src="./assets/svg/fotogram_name_logo.svg" alt="Fotogram logo with lettering">
        </div>
    </header>
    <main class="bodyMain">
        <section class="mainSection">
            <h1>Your personal photo album</h1>
            <div id="photos"></div>
            <dialog id="photoDialog">
                <div class="dialogContent"></div>
                <header class="dialogHeader">
                    <h2 id="headerDialog">
                    </h2>
                    <button onclick="closeDialog()" aria-label="close Dialog" class="closeButton"></button>
                </header>
                <section id="sectionDialog">
                </section>

                <footer id="footerDialog">
                    <button id="buttonBack" class="desingButton backButton" onclick="clickBackButton()"></button>
                    <div id="picNbr"></div>
                    <button id="buttonNext" class="desingButton nextButton" onclick="clickNextButton()"></button>

                </footer>
                </div>
            </dialog>
        </section>
    </main>
    <footer class="bodyFooter">
        <img class="footer_wave" src="./assets/svg/footer_curved.svg" alt="Curved footer">
        <div class="footer_content">
            <img src="./assets/svg/da_logo.svg" alt="Developer Akademie logo with lettering">
        </div>
    </footer>


</body>

</html>
